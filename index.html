<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>

  <script>
    const RedirectURLs = [
      "https://jatos.mindprobe.eu/publix/hStXJ4yyEog/",
      "https://jatos.mindprobe.eu/publix/n7SOOsGBLbb/",
      "https://jatos.mindprobe.eu/publix/RVJXxrwF0Xe/",
      "https://jatos.mindprobe.eu/publix/qaJsMdPV4iq/",
      "https://jatos.mindprobe.eu/publix/QKj6XmN99wQ/",
      "https://jatos.mindprobe.eu/publix/ZF11NgGLOql/"
    ];

    const cookieName = "rnd_osweb_experiment_1";

    function getCookie(name) {
      const cookies = document.cookie.split(";").map(c => c.trim());
      for (const c of cookies) {
        if (c.startsWith(name + "=")) {
          return c.substring(name.length + 1);
        }
      }
      return "";
    }

    function setCookie(name, value, days) {
      const d = new Date();
      d.setTime(d.getTime() + days * 24 * 60 * 60 * 1000);
      document.cookie = `${name}=${value};expires=${d.toUTCString()};path=/`;
    }

    function getRandomIndex() {
      let index = parseInt(getCookie(cookieName), 10);

      // wichtig: alten/kaputten Cookie verwerfen
      if (Number.isNaN(index) || index < 0 || index >= RedirectURLs.length) {
        index = Math.floor(Math.random() * RedirectURLs.length);
        setCookie(cookieName, index, 30);
      }

      return index;
    }

    const index = getRandomIndex();
    const gotoUrl = RedirectURLs[index];

    if (window.location.search === "?debug") {
      document.write("Redirect index: " + index + "<br>URL: " + gotoUrl);
    } else {
      window.location.replace(gotoUrl);
    }
  </script>
</head>
<body>
  Redirecting...
</body>
</html>
